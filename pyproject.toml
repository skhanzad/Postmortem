[build-system]
requires = ["maturin>=1.5,<2.0"]
build-backend = "maturin"

[project]
name = "postmortem-ci"
version = "0.1.0"
description = "Catch AI coding agents cheating on your tests before you commit."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8", "maturin>=1.5"]

[project.scripts]
postmortem = "postmortem.cli:main"

[tool.maturin]
python-source = "python"
module-name = "postmortem._core"
features = ["pyo3/extension-module"]

[tool.pytest.ini_options]
testpaths = ["tests"]
